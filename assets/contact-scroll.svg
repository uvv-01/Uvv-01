<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 150" width="100%" height="150">
  <defs>
    <!-- Background Slate Panel -->
    <linearGradient id="scroll-panel-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121720"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <!-- Dark Walnut Wood Roller Gradients -->
    <linearGradient id="walnut-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a2e1b"/>
      <stop offset="40%" stop-color="#321c0e"/>
      <stop offset="80%" stop-color="#1f1007"/>
      <stop offset="100%" stop-color="#120803"/>
    </linearGradient>

    <linearGradient id="brass-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d4af37"/>
      <stop offset="50%" stop-color="#aa820a"/>
      <stop offset="100%" stop-color="#553f02"/>
    </linearGradient>

    <!-- Aged Parchment Cream to Sepia Gradient -->
    <linearGradient id="parchment-cylinder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b88f58"/>
      <stop offset="15%" stop-color="#eedbb9"/>
      <stop offset="50%" stop-color="#f5e7cb"/>
      <stop offset="85%" stop-color="#eedbb9"/>
      <stop offset="100%" stop-color="#9a723e"/>
    </linearGradient>

    <!-- Linen Ribbon Tie -->
    <linearGradient id="ribbon-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#734d28"/>
      <stop offset="50%" stop-color="#553618"/>
      <stop offset="100%" stop-color="#3b230d"/>
    </linearGradient>

    <filter id="soft-depth" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .dispatch-title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      text-transform: uppercase;
      fill: #8b949e;
    }
    .callout-text {
      font-family: 'Georgia', 'Cambria', 'Times New Roman', serif;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #f0f6fc;
    }
    .sub-callout {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      fill: #8b949e;
    }
  </style>

  <!-- Container Panel Base -->
  <rect x="8" y="8" width="944" height="134" rx="8" fill="url(#scroll-panel-bg)" filter="url(#soft-depth)"/>
  <rect x="8" y="8" width="944" height="134" rx="8" fill="none" stroke="#21262d" stroke-width="1"/>
  <line x1="20" y1="9" x2="940" y2="9" stroke="#30363d" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Top Dispatch Header -->
  <text x="24" y="28" class="dispatch-title">CONTACT DISPATCH</text>
  <text x="936" y="28" text-anchor="end" class="dispatch-title">HISTORICAL ARCHIVE</text>
  <line x1="24" y1="36" x2="936" y2="36" stroke="#21262d" stroke-width="1"/>

  <!-- Center Scroll Representation -->
  <!-- Top Wooden Roller Spindle -->
  <g transform="translate(190, 52)">
    <!-- Spindle Body -->
    <rect x="0" y="0" width="580" height="12" rx="3" fill="url(#walnut-grad)" stroke="#120803" stroke-width="0.5"/>
    <!-- Brass End Knobs -->
    <rect x="-8" y="-3" width="9" height="18" rx="2" fill="url(#brass-grad)"/>
    <rect x="579" y="-3" width="9" height="18" rx="2" fill="url(#brass-grad)"/>

    <!-- Rolled Parchment Cylinder Body -->
    <rect x="18" y="11" width="544" height="34" rx="4" fill="url(#parchment-cylinder)" stroke="#8c6434" stroke-width="0.75"/>
    <!-- Parchment Crease / Shading Lines -->
    <line x1="24" y1="18" x2="556" y2="18" stroke="#ffffff" stroke-opacity="0.3" stroke-width="1"/>
    <line x1="24" y1="38" x2="556" y2="38" stroke="#68471e" stroke-opacity="0.35" stroke-width="1"/>

    <!-- Weathered Ribbon Tie Bands -->
    <rect x="120" y="11" width="8" height="34" fill="url(#ribbon-grad)"/>
    <rect x="452" y="11" width="8" height="34" fill="url(#ribbon-grad)"/>

    <!-- Bottom Wooden Roller Spindle -->
    <rect x="0" y="44" width="580" height="12" rx="3" fill="url(#walnut-grad)" stroke="#120803" stroke-width="0.5"/>
    <rect x="-8" y="41" width="9" height="18" rx="2" fill="url(#brass-grad)"/>
    <rect x="579" y="41" width="9" height="18" rx="2" fill="url(#brass-grad)"/>

    <!-- Central Callout Text on Parchment -->
    <text x="290" y="32" text-anchor="middle" font-family="'Georgia', serif" font-size="11.5" font-weight="700" fill="#382211" letter-spacing="2">
      ✦ CLICK TO UNROLL PARCHMENT ✦
    </text>
  </g>

  <!-- Bottom Interactive Status Hint -->
  <text x="480.0" y="128" text-anchor="middle" class="sub-callout">
    [ Interactive Manuscript: GitHub · LinkedIn · Email Direct ]
  </text>
</svg>