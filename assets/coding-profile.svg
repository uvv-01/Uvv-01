<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="100%" height="430">
  <defs>
    <!-- Dark matte slate panel gradients -->
    <linearGradient id="main-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#121720"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>

    <linearGradient id="card-panel-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#181e28"/>
      <stop offset="100%" stop-color="#121720"/>
    </linearGradient>

    <!-- Restrained graph fills -->
    <linearGradient id="lc-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="cf-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#94a3b8" stop-opacity="0.0"/>
    </linearGradient>

    <linearGradient id="cc-fill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#d97706" stop-opacity="0.0"/>
    </linearGradient>

    <!-- Controlled physical drop shadow -->
    <filter id="panel-shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <style>
    .header-label {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 2px;
      fill: #8b949e;
    }
    .platform-name {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 1px;
      fill: #f0f6fc;
    }
    .stat-label {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: 1.5px;
      fill: #8b949e;
    }
    .rating-val {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', sans-serif;
      font-size: 30px;
      font-weight: 700;
      fill: #f0f6fc;
    }
    .solved-header {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1px;
      fill: #f0f6fc;
    }
    .meta-val {
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      fill: #8b949e;
    }
    .meta-highlight {
      font-weight: 700;
      fill: #f0f6fc;
    }
    .card-shell {
      transition: transform 0.2s ease, stroke 0.2s ease;
    }
    .card-shell:hover {
      transform: translateY(-2px);
    }
  </style>

  <!-- Container Base -->
  <rect x="8" y="8" width="944" height="414" rx="8" fill="url(#main-bg)" filter="url(#panel-shadow)"/>
  <rect x="8" y="8" width="944" height="414" rx="8" fill="none" stroke="#21262d" stroke-width="1"/>

  <!-- Top Bevel Highlight Edge -->
  <line x1="20" y1="9" x2="940" y2="9" stroke="#30363d" stroke-width="1" stroke-opacity="0.6"/>

  <!-- Header Row -->
