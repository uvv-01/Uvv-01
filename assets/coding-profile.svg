        <text x="0" y="54" fill="#da3633" font-size="10" font-family="Consolas, monospace" font-weight="600">HARD</text>
        <text x="45" y="54" class="meta-highlight" font-size="10" font-family="Consolas, monospace">2</text>
        <rect x="80" y="46" width="152" height="8" rx="2" fill="#21262d"/>
        <rect x="80" y="46" width="1" height="8" rx="2" fill="#da3633"/>
      </g>
    </g>
  </g>

  <!-- CARD 2: CODEFORCES -->
