          <text x="474" y="224" text-anchor="middle" fill="#8b949e" font-size="11" font-family="-apple-system, sans-serif" font-weight="600">Account Unlinked</text>
          <text x="474" y="242" text-anchor="middle" fill="#6e7681" font-size="9" font-family="Consolas, monospace">Set handle in config to sync graph</text>
        </g>
        

    <!-- Bottom Stat Block -->
    
        <g transform="translate(344, 284)">
          <rect x="0" y="0" width="260" height="102" rx="4" fill="#0d1117" stroke="#21262d" stroke-width="1"/>
          <text x="14" y="22" class="stat-label">STATUS</text>
