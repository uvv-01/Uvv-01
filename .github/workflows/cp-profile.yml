name: Generate Profile Assets

on:
  schedule:
    - cron: "0 */6 * * *"  # Every 6 hours
  workflow_dispatch:  # Manual trigger
  push:
    branches: [main, master]
    paths:
      - 'scripts/**'
      - '.github/workflows/cp-profile.yml'

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Master Asset Generator
        run: python3 scripts/build_all.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet assets/ 2>/dev/null; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push if changed
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Yuvraj Singh"
          git config user.email "yuvrajsinghdnb336@gmail.com"
          git add assets/
          git commit -m "Update profile dashboard assets"
          git push
